<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="benzoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#9146ff" />
    </linearGradient>
    <filter id="benzoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#080b10" />
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="url(#benzoGrad)" stroke-width="3" />
  <!-- TV Antenna -->
  <line x1="32" y1="20" x2="50" y2="34" stroke="url(#benzoGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="68" y1="20" x2="50" y2="34" stroke="url(#benzoGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- TV Monitor Body -->
  <rect x="20" y="34" width="60" height="46" rx="10" fill="#111622" stroke="url(#benzoGrad)" stroke-width="3" />
  <!-- Glowing B / Screen -->
  <path d="M36 44 H48 C54 44 58 47 58 52 C58 55 56 57 53 58 C57 59 60 62 60 67 C60 72 55 75 48 75 H36 V44 Z M42 50 V56 H47 C50 56 52 54 52 52 C52 50 50 50 47 50 H42 Z M42 62 V69 H48 C51 69 54 67 54 65 C54 63 51 62 48 62 H42 Z" fill="url(#benzoGrad)" filter="url(#benzoGlow)" />
  <!-- CRT screen curve accent -->
  <circle cx="73" cy="42" r="2.5" fill="#10b981" />
  <circle cx="73" cy="50" r="2.5" fill="#00f0ff" />
</svg>
